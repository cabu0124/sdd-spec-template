# Three rules that were only prose until now: every spec carries a valid status
# and no open question when it is approved, specs/INDEX.md agrees with the
# headers because it is generated from them, and this repository holds no plans
# or task lists. The third is Rule 1 — Specs Only, Spec First — and it is the one
# that keeps the separation between this repository and the ones that build
# from it.
#
# All of them run from scripts/sdd-check.sh, so what fails here is what fails
# on a laptop, with the same message.
# See docs/lifecycle.md and AGENTS.md.
name: Specs

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  specs-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every check this repository runs
        run: bash scripts/sdd-check.sh
