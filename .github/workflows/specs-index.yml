# Three rules that were only prose until now: every spec carries a valid status
# and no open question when it is approved, specs/INDEX.md agrees with the
# headers because it is generated from them, and this repository holds no plans
# or task lists. The third is Rule 1 — Specs Only, Spec First — and it is the one
# that keeps the separation between this repository and the ones that build
# from it.
# See docs/lifecycle.md and AGENTS.md.
name: Specs

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  specs-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Specs Only — no plans, no task lists
        run: |
          set -euo pipefail
          # Tracked files only, matched by exact name so a legitimate product
          # document like docs/product/rollout-plan.md does not trip the rule.
          stray=$(git ls-files -- 'plan.md' '*/plan.md' 'tasks.md' '*/tasks.md')
          if [ -n "$stray" ]; then
            while read -r f; do
              echo "::error file=$f::a plan or a task list belongs to the repository that builds the spec, never here (AGENTS.md, Rule 1)"
            done <<<"$stray"
            exit 1
          fi
          echo "No plans or task lists. Specs only."

      - name: specs/INDEX.md matches the spec headers
        run: scripts/spec-index.sh --check

      - name: Every spec's status, id, placeholders and open questions are clean
        run: scripts/spec-check.sh
