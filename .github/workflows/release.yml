# The next version is derived from the commits on main, never typed by a person.
# No release branch, no release pull request, nothing to keep in step.
# See docs/lifecycle.md.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — without the tags every run looks like the first release.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the next version
        id: v
        run: |
          set -euo pipefail
          last=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1)
          if [ -n "$last" ]; then range="$last..HEAD"; else range="HEAD"; fi
          base="${last:-v0.0.0}"
          subjects=$(git log --no-merges --format='%s' "$range")
          bodies=$(git log --no-merges --format='%B' "$range")
          bump=none
          if grep -qE '^[a-z]+(\([^)]*\))?!:' <<<"$subjects" \
             || grep -qE '^BREAKING[ -]CHANGE:' <<<"$bodies"; then
            bump=major
          elif grep -qE '^feat(\([^)]*\))?:' <<<"$subjects"; then
            bump=minor
          elif grep -qE '^(fix|perf)(\([^)]*\))?:' <<<"$subjects"; then
            bump=patch
          fi
          echo "bump=$bump" >>"$GITHUB_OUTPUT"
          if [ "$bump" = none ]; then
            echo "Nothing to release since ${last:-the first commit}."
            exit 0
          fi
          IFS=. read -r ma mi pa <<<"${base#v}"
          case "$bump" in
            major) ma=$((ma + 1)); mi=0; pa=0 ;;
            minor) mi=$((mi + 1)); pa=0 ;;
            patch) pa=$((pa + 1)) ;;
          esac
          echo "version=v$ma.$mi.$pa" >>"$GITHUB_OUTPUT"
          echo "previous=$last" >>"$GITHUB_OUTPUT"

      - name: Tag and release
        if: steps.v.outputs.bump != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          PREVIOUS: ${{ steps.v.outputs.previous }}
        run: |
          set -euo pipefail
          git tag "$VERSION"
          git push origin "$VERSION"
          gh release create "$VERSION" --title "$VERSION" --target main \
            --generate-notes ${PREVIOUS:+--notes-start-tag "$PREVIOUS"}

      # Best effort. A protected main rejects this push — github-actions[bot]
      # cannot be added to a ruleset bypass list — and that must not fail a
      # release that already succeeded. The GitHub Release carries the notes.
      - name: Update CHANGELOG.md
        if: steps.v.outputs.bump != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          notes=$(gh release view "$VERSION" --json body --jq .body)
          touch CHANGELOG.md
          { printf '## %s — %s\n\n%s\n\n' "$VERSION" "$(date -u +%F)" "$notes"
            cat CHANGELOG.md
          } >CHANGELOG.next
          mv CHANGELOG.next CHANGELOG.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          git commit -m "chore(release): $VERSION [skip ci]"
          git push origin HEAD:main || {
            echo "::warning::CHANGELOG.md not committed: main rejects pushes from Actions. $VERSION and its release notes are unaffected."
            exit 0
          }
